[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "choreo-cli"
version = "0.0.1"
description = "A Claude-Code-style coding agent harness built on choreoai."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Karthik Reddy" }]
keywords = ["coding-agent", "cli", "choreoai", "llm", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "choreoai @ git+https://github.com/choreo-ai/choreo",
  "rich",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/choreo-ai/choreo-cli"
Repository = "https://github.com/choreo-ai/choreo-cli"
Issues = "https://github.com/choreo-ai/choreo-cli/issues"

[project.scripts]
choreo-cli = "choreo_cli.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/choreo_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
