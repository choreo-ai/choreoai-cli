# Build and publish choreoai-cli to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC) via pypa/gh-action-pypi-publish —
# no API token is stored in the repository.
#
# PyPI Trusted Publisher must match exactly:
#   owner: choreo-ai, repo: choreoai-cli, workflow: release.yml, environment: pypi
#
# Publish order: publish choreoai first, then this package (depends on choreoai).
#
# https://docs.pypi.org/trusted-publishers/

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # Mandatory for Trusted Publishing (OIDC)
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
