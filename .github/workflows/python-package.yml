name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and deps
        run: |
          python -m pip install --upgrade pip
          # choreoai is not on PyPI yet; install from git first so
          # choreoai>=0.0.1 in pyproject is already satisfied offline-from-index.
          pip install "choreoai @ git+https://github.com/choreo-ai/choreoai"
          pip install -e ".[dev]"


      - name: Run pytest (offline)
        env:
          # Ensure tests never attempt live Anthropic calls
          ANTHROPIC_API_KEY: ""
        run: pytest -q
