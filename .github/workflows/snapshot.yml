# Publish a TestPyPI snapshot on every push to main (and on manual dispatch).
#
# Versioning (Option 1 — one snapshot line in source, unique builds at publish):
#   Source (repo):     0.0.6.dev0
#   Each TestPyPI build: 0.0.6.devYYYYMMDDHHMMSS  (UTC timestamp)
#   Example:           0.0.6.dev20260731120001
#
# The repo stays on the 0.0.6 development line; only CI rewrites the version
# for the build artifact (not committed back).
#
# Install latest snapshot:
#   pip install -i https://test.pypi.org/simple/ \
#     --extra-index-url https://pypi.org/simple/ \
#     --pre choreoai-cli
#
# Or pin a specific build:
#   pip install -i https://test.pypi.org/simple/ \
#     --extra-index-url https://pypi.org/simple/ \
#     'choreoai-cli==0.0.6.dev20260731120001'
#
# Trusted Publisher (on https://test.pypi.org, not pypi.org):
#   owner: choreo-ai, repo: choreoai-cli, workflow: snapshot.yml, environment: testpypi
#
# https://docs.pypi.org/trusted-publishers/

name: Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

# One snapshot at a time per branch; do not cancel — every commit should publish.
concurrency:
  group: snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot-build:
    runs-on: ubuntu-latest
    outputs:
      snapshot_version: ${{ steps.stamp.outputs.snapshot_version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Stamp unique snapshot version (UTC timestamp)
        id: stamp
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          m = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          if not m:
              raise SystemExit("version not found in pyproject.toml")

          # Source is e.g. 0.0.6.dev0 → public line 0.0.6 → build 0.0.6.devYYYYMMDDHHMMSS
          raw = m.group(1).split("+", 1)[0]
          base = re.sub(r"\.dev\d+$", "", raw)
          stamp = datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
          snap = f"{base}.dev{stamp}"

          text, n = re.subn(
              r'^version\s*=\s*"[^"]+"',
              f'version = "{snap}"',
              text,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit("failed to update version in pyproject.toml")
          pyproject.write_text(text, encoding="utf-8")

          init = Path("src/choreoai_cli/__init__.py")
          init_text = init.read_text(encoding="utf-8")
          init_text, n = re.subn(
              r'^__version__\s*=\s*"[^"]+"',
              f'__version__ = "{snap}"',
              init_text,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit("failed to update __version__ in src/choreoai_cli/__init__.py")
          init.write_text(init_text, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"snapshot_version={snap}\n")
          print(f"Source version line: {raw}")
          print(f"Stamped TestPyPI version: {snap}")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          ls -la dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-dists
          path: dist/

      - name: Summary
        run: |
          {
            echo "### TestPyPI snapshot"
            echo ""
            echo "Version: \`${{ steps.stamp.outputs.snapshot_version }}\`"
            echo ""
            echo "Latest on this line (includes pre-releases):"
            echo '```bash'
            echo "pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ --pre --upgrade choreoai-cli"
            echo '```'
            echo ""
            echo "Pin this build:"
            echo '```bash'
            echo "pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ 'choreoai-cli==${{ steps.stamp.outputs.snapshot_version }}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  testpypi-publish:
    runs-on: ubuntu-latest
    needs:
      - snapshot-build
    permissions:
      id-token: write
    environment:
      name: testpypi

    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@v4
        with:
          name: snapshot-dists
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          # Safe for workflow re-runs of the same unique version.
          skip-existing: true
