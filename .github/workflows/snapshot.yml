# Publish a TestPyPI snapshot on every push to main (and on manual dispatch).
#
# Each commit gets a unique PEP 440 version so successive main pushes always
# produce a new installable build:
#   {pyproject version}.dev{run_number}+g{short_sha}
# Example: 0.0.6.dev42+g1a2b3c4
#
# Install:
#   pip install -i https://test.pypi.org/simple/ \
#     --extra-index-url https://pypi.org/simple/ \
#     'choreoai-cli==0.0.6.dev42+g1a2b3c4'
#
# Trusted Publisher (on https://test.pypi.org, not pypi.org):
#   owner: choreo-ai, repo: choreoai-cli, workflow: snapshot.yml, environment: testpypi
#
# https://docs.pypi.org/trusted-publishers/

name: Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

# One snapshot at a time per branch; do not cancel — every commit should publish.
concurrency:
  group: snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot-build:
    runs-on: ubuntu-latest
    outputs:
      snapshot_version: ${{ steps.stamp.outputs.snapshot_version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Stamp unique snapshot version
        id: stamp
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          run = os.environ["RUN_NUMBER"]
          sha = os.environ["SHA"][:7]

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          m = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          if not m:
              raise SystemExit("version not found in pyproject.toml")
          base = m.group(1).split("+", 1)[0]
          base = re.sub(r"\.dev\d+$", "", base)
          snap = f"{base}.dev{run}+g{sha}"

          text, n = re.subn(
              r'^version\s*=\s*"[^"]+"',
              f'version = "{snap}"',
              text,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit("failed to update version in pyproject.toml")
          pyproject.write_text(text, encoding="utf-8")

          init = Path("src/choreo_cli/__init__.py")
          init_text = init.read_text(encoding="utf-8")
          init_text, n = re.subn(
              r'^__version__\s*=\s*"[^"]+"',
              f'__version__ = "{snap}"',
              init_text,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit("failed to update __version__ in src/choreo_cli/__init__.py")
          init.write_text(init_text, encoding="utf-8")

          # Delimiter form is safer for PEP 440 local versions containing '+'.
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"snapshot_version<<EOF\n{snap}\nEOF\n")
          print(f"Stamped snapshot version: {snap}")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          ls -la dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-dists
          path: dist/

      - name: Summary
        run: |
          {
            echo "### TestPyPI snapshot"
            echo ""
            echo "Version: \`${{ steps.stamp.outputs.snapshot_version }}\`"
            echo ""
            echo '```bash'
            echo "pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ 'choreoai-cli==${{ steps.stamp.outputs.snapshot_version }}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  testpypi-publish:
    runs-on: ubuntu-latest
    needs:
      - snapshot-build
    permissions:
      id-token: write
    environment:
      name: testpypi

    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@v4
        with:
          name: snapshot-dists
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          # Safe for workflow re-runs of the same unique version.
          skip-existing: true
